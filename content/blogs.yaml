  # or a file at content/blog/<slug>.md.
  - slug: "adapting-llama-for-ner-tasks"
    title: "Adapting LLaMA for NER Tasks"
    description: >
      Customize your models using PEFT. Fine-tuning LLaMA 3.2 1B for token
      classification with LoRA adapters and 4-bit quantization, on a single GPU.
    date: "2025-09-24"            # quoted; free-form text also works
    reading_time: "7 min read"    # optional
    thumbnail: "/projects/placeholder.svg"
    tags: ["Large Language Models", "LLM Finetuning", "NLP", "AI", "Llama 3"]
    # Where the post is also published. Renders a "Read post" button that opens
    # in a new tab. Delete it if the post only lives on this site.
    # url: "https://medium.com/@namesarnav/..."

  - slug: "profiling-before-optimising"
    title: "Language Model Distillation"
    description: >
      What a flame graph would have told me on day one, and the habit I built
      afterwards for deciding what is actually worth speeding up.
    date: "2026-03-18"
    reading_time: "6 min read"
    thumbnail: "/projects/placeholder.svg"
    tags: ["NLP", "LLM"]
    url: "https://arnavverma.hashnode.dev/model-distillation"
    # `details` generates a page at /blog/<slug> and adds a "Read more" button,
    # exactly like projects. Use it for posts you want hosted here.
    details:
      - heading: "The setup"
        body: >
          The training loop was slow, the GPU was busy, and I assumed those two
          facts were related. They were not.
      - heading: "What the profiler said"
        body: >
          Ninety-one percent of wall time was in the data loader, waiting on a
          per-sample JSON parse that ran once per epoch per worker.

