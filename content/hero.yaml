# The opening screen: name and title.
# `tagline`, `location` and `actions` are all optional — delete what you don't need.

name: "Arnav Verma"
title: "AI Engineering & Research"

tagline: >
  I work on language model safety and evaluations representation learning and the systems that make it practical.
  Currently a Masters student at NYU Courant.
  Currently focused on efficient training and evaluation of multimodal models.

location: "📍 New York, NY"

# A file in public/ or a full URL. Delete the line and the hero goes text-only.
photo: "/sexy-arnav.jpeg"
# Optional. Defaults to `name`, which is what you want for a portrait.
# photo_alt: "Arnav Verma"

# Credential badges under the location line. Each needs an `image` in public/
# and a `label`; add `href` to link the chip to the credential itself.
# Delete the whole `badges:` block and none render.
badges:
  - image: "/projects/ckad-logo.png"
    label: "Certified Kubernetes Application Developer"
    # href: "https://www.credly.com/badges/..."   # add your Credly link

# Optional butto  ns under the tagline. Delete the whole `actions:` block to hide them.
actions:
  - label: "View My Work"
    href: "#projects"
    variant: "primary"
  - label: "Get in Touch"
    href: "#contact"
    variant: "secondary"
  - label: "View Resume"
    href: "/documents/resume.pdf"
    variant: "secondary"
