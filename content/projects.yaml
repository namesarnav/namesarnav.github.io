## ------------------------------------------------------------------------------------------- ##
  # `slug` is the URL for the detail page: /projects/<slug>. Keep it unique.
  - slug: "spectral-distill"
    title: "Semantic Video Search Engine"
    description: >
      A distillation recipe that keeps 94% of teacher accuracy at a twelfth of the
      parameter count, by matching intermediate spectral statistics instead of logits.
    thumbnail: "/projects/placeholder.svg"     # optional; a neutral panel shows if omitted
    tags: ["PyTorch", "CLIP", "Distillation", "CUDA"]
    links:
      code: "https://github.com/namesarnav/"
      demo: "https://huggingface.co/spaces/namesarnav/spectral-distill"
    # Delete `details` to hide the "Read more" button. Present = a page is generated
    # at /projects/spectral-distill from the blocks below.
    details:
      - heading: "The problem"
        body: >
          On-device speech models are latency-bound long before they are
          accuracy-bound. Standard logit distillation collapses the teacher's
          frequency-selective behaviour, which is exactly what the small student
          needs to keep.
      - heading: "Approach"
        body: >
          We match second-order statistics of intermediate activations in the
          mel-frequency basis, adding a single term to the loss and no new
          parameters. Training cost rises about 8%.
      - heading: "Results"
        body: >
          12x fewer parameters, 94% of teacher WER-relative accuracy, and a 3.4x
          real-time factor improvement on a Pixel 7.





