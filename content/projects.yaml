  - slug: "folio"
    title: "Folio - Learning Tracker for Students with ADHD"
    description: >
      If you're like me who's got ADHD and struggle a lot managing multiple resources to study. I built
      this for you, all of your study material at one place. Youtube, Books, PDFs, No juggling around. 
    thumbnail: "/projects/folio.png"     # optional; a neutral panel shows if omitted
    tags: ["React", "FastAPI", "MongoDB", "Docker", "Cloudflare R2"]
    links:
      code: "https://github.com/namesarnav/folio"



