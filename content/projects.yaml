## ------------------------------------------------------------------------------------------- ##

  - slug: "ledger"
    title: "Ledger — a Query Planner for Small Analytical Workloads"
    description: >
      A single-binary columnar query engine with a cost-based planner, written to
      understand what actually makes analytical queries fast at gigabyte scale.
    thumbnail: "/projects/placeholder.svg"
    tags: ["Rust", "Databases", "Query Planning"]
    links:
      code: "https://github.com/yourhandle/ledger"
    details:
      - heading: "Why"
        body: >
          Most analytical workloads never leave one machine. Ledger asks how far a
          careful planner and a tight vectorised executor can go before you need a
          cluster at all.
      - heading: "Design"
        body: >
          Arrow-backed columnar storage, a Volcano-style planner with histogram
          statistics, and morsel-driven parallelism across cores.

