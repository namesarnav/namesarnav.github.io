heading: "Research"

blurb: "Papers and preprints. Status is stated on each — nothing here claims more than it is."

# Buttons at the foot of the section. Naming a `social` borrows that platform's
# icon and gives you "View <Name>" for free; add `label:` to say something else.
# Delete the block and no buttons render.
actions:
  - social: huggingface
    href: "https://huggingface.co/namesarnav"
  - social: google_scholar
    href: "https://scholar.google.com/citations?user=XXXX"

# Your name, bolded automatically wherever it appears in an author list.
# Write it exactly as it appears in `authors` below.
highlight_author: "Arnav Verma"

items:
  # `status` carries the whole truth about where a paper stands. Use
  # "Under review, 2026" while it is out for review — naming the venue is only
  # safe if that venue's anonymity policy allows it — and swap in the venue
  # ("NeurIPS 2026") once it is accepted. Nothing else needs to change.
  - title: "Spectral Distillation for Small Speech Models"
    authors:
      - "Arnav Verma"
      - "A. Collaborator"
      - "B. Advisor"
    status: "Under review, 2026"
    year: 2026
    summary: >
      A distillation objective that matches intermediate spectral statistics
      rather than logits, keeping frequency-selective behaviour the student
      would otherwise lose.
    # Every link is optional; buttons appear only for the ones you fill in.
    links:
      arxiv: "https://arxiv.org/abs/0000.00000"
      code: "https://github.com/yourhandle/spectral-distill"

  - title: "On the Sample Efficiency of Morsel-Parallel Query Planners"
    authors:
      - "C. Coauthor"
      - "Arnav Verma"
    status: "Under review, 2026"
    year: 2026
    summary: >
      Cost models for single-machine analytical workloads, and where the usual
      cardinality assumptions stop holding.

  # An accepted paper looks the same — only `status` differs.
  - title: "Warm-Starting Research Environments at Scale"
    authors:
      - "Arnav Verma"
      - "D. Coauthor"
    status: "Workshop on ML Systems, 2025"
    year: 2025
    links:
      pdf: "/papers/warm-starting.pdf"
      doi: "https://doi.org/10.0000/000000"
