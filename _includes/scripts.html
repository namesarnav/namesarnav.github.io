<script>
  document.querySelector(".theme-toggle").addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
    if (window.__redrawMermaid) window.__redrawMermaid();
  });
</script>
{% if page.math %}
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>

  onload="renderMathInElement(document.querySelector('.main'), {delimiters: [{left: '\\[', right: '\\]', display: true}, {left: '\\(', right: '\\)', display: false}], throwOnError: false})"></script>
{% endif %}
<script type="module">
  // ```mermaid fences come out of Rouge as plain code blocks; swap each for a
  // <pre class="mermaid"> and only load mermaid on pages that have one.
  const blocks = [...document.querySelectorAll(".language-mermaid")];
  if (blocks.length) {
    const pres = blocks.map((el) => {
      const pre = document.createElement("pre");
      pre.className = "mermaid";
      pre.dataset.src = el.textContent;
      pre.textContent = el.textContent;
      (el.closest(".highlighter-rouge") || el.closest("pre") || el).replaceWith(pre);
      return pre;
    });
    const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs");
    const draw = async () => {
      const dark = document.documentElement.getAttribute("data-theme") === "dark";
      // Natural size, scrolling sideways when wide, rather than shrunk to fit.
      const natural = { useMaxWidth: false };
      mermaid.initialize({
        startOnLoad: false,
        theme: dark ? "dark" : "neutral",
        flowchart: natural, sequence: natural, state: natural, class: natural, er: natural, gantt: natural,
      });
      pres.forEach((p) => { p.removeAttribute("data-processed"); p.textContent = p.dataset.src; });
      await mermaid.run({ nodes: pres });
    };
    window.__redrawMermaid = draw;
    await draw();
  }
</script>
