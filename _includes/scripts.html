{% if page.math %}
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js"
  onload="renderMathInElement(document.querySelector('.content'), {delimiters: [{left: '\\[', right: '\\]', display: true}, {left: '\\(', right: '\\)', display: false}], throwOnError: false})"></script>
{% endif %}
<script type="module">
  // ```mermaid fences come out of Rouge as plain code blocks; swap each for the
  // <pre class="mermaid"> mermaid looks for, and only load mermaid when needed.
  const blocks = document.querySelectorAll(".language-mermaid");
  if (blocks.length) {
    blocks.forEach((el) => {
      const pre = document.createElement("pre");
      pre.className = "mermaid";
      pre.textContent = el.textContent;
      (el.closest(".highlighter-rouge") || el).replaceWith(pre);
    });
    const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs");
    mermaid.initialize({ startOnLoad: false, theme: "neutral" });
    await mermaid.run({ querySelector: "pre.mermaid" });
  }
</script>
