<header class="masthead">
  <div class="masthead-inner">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav" aria-label="Main">
      {% for item in site.nav %}
        {% assign active = false %}
        {% if page.url contains item.url %}{% assign active = true %}{% endif %}
        <a href="{{ item.url | relative_url }}"{% if active %} class="active" aria-current="page"{% endif %}>{{ item.label }}</a>
      {% endfor %}
    </nav>
    <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
      <i class="fa-solid fa-moon icon-moon" aria-hidden="true"></i>
      <i class="fa-solid fa-sun icon-sun" aria-hidden="true"></i>
    </button>
  </div>
</header>
