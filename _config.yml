# Academic profile, in the spirit of AcademicPages (https://academicpages.github.io).

title:        "Arnav Verma"
tagline:      "AI Engineering & Research"
description:  "Portfolio of Arnav Verma — machine learning research and engineering."
url:          "https://namesarnav.com"
baseurl:      ""
author:
  name:       "Arnav Verma"
image:        "/og.png"

# Top-bar navigation, in order. `external: true` opens in a new tab.
nav:
  - { label: "Publications",   url: "/publications/" }
  - { label: "Projects",       url: "/projects/" }
  - { label: "Writing",        url: "/blog/" }
  - { label: "Education",      url: "/education/" }
  - { label: "Skills",         url: "/skills/" }
  - { label: "Certifications", url: "/certifications/" }
  - { label: "CV",             url: "/documents/resume.pdf" }
# /documents/ exists but is deliberately unlisted.

markdown:     kramdown
highlighter:  rouge
kramdown:
  input:      GFM
  hard_wrap:  false
  syntax_highlighter: rouge
  math_engine: mathjax

permalink:    pretty

collections:
  projects:
    output:    true
    permalink: /projects/:name/

defaults:
  - scope: { path: "", type: "projects" }
    values: { layout: "project", render_with_liquid: false }
  - scope: { path: "", type: "posts" }
    values: { layout: "post", permalink: "/blog/:slug/", render_with_liquid: false }

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache
